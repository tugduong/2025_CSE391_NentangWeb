<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Form</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #f5f5f5;
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .form-wrapper {
      max-width: 1800px;
      width: 100%;
      margin: 0 auto;
      background: #fff;
      border: 1px solid #000;
      padding: 20px;
    }
    .form-wrapper h2 {
      font-size: 1rem;
      margin-bottom: 15px;
      color: #444;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .row {
      display: flex;
      gap: 15px;
    }
    .row input,
    .row textarea {
      flex: 1;
      padding: 10px;
      font-size: 0.9rem;
      border: 1px solid #ccc;
      border-radius: 2px;
    }
    .row-full {
      display: flex;
      flex-direction: column;
    }
    .row-full input,
    .row-full textarea {
      width: 100%;
      padding: 10px;
      font-size: 0.9rem;
      border: 1px solid #ccc;
      border-radius: 2px;
    }
    textarea {
      min-height: 180px;
      resize: vertical;
    }
    .bottom {
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .bottom button {
      padding: 10px 20px;
      background: #80d8ff;
      border: none;
      border-radius: 2px;
      color: #fff;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .bottom .note {
      margin-left: auto;
      font-size: 0.8rem;
      color: #555;
    }
    button:hover {
      background: #4fc3f7;
    }
  </style>
</head>
<body>

  <div class="form-wrapper">
    <h2>Get in touch with us by filling contact form below</h2>
    <form action="#" method="post">
      <!-- Dòng 1: Name + Email -->
      <div class="row">
        <input type="text" name="name" placeholder="* Enter your full name" required>
        <input type="email" name="email" placeholder="* Enter your email address" required>
      </div>
      <!-- Dòng 2: Subject -->
      <div class="row">
        <input type="text" name="subject" placeholder="Enter your subject">
      </div>
      <!-- Dòng 3: Message -->
      <div class="row-full">
        <textarea name="message" placeholder="* Your message here..." required></textarea>
      </div>
      <!-- Nút gửi + ghi chú -->
      <div class="bottom">
        <button type="submit">Send message</button>
        <div class="note">* Please fill all required form field, thanks!</div>
      </div>
    </form>
  </div>

</body>
</html>

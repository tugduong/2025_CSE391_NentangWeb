<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Bài Tập 04 - Form Nhân Viên</title>
  <style>
    body {
      font-family: Arial, sans-serif;
    }
    fieldset {
      border: 1px solid #ccc;
      padding: 15px;
      margin-bottom: 20px;
    }
    legend {
      font-weight: bold;
    }
    label {
      display: inline-block;
      width: 150px;
      vertical-align: top;
      margin-top: 6px;
    }
    input, select, textarea {
      width: 300px;
      padding: 5px;
      margin-bottom: 10px;
    }
    .radio-group, .checkbox-group {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }
    .actions {
      margin-top: 20px;
    }
    .actions input {
      width: auto;
      padding: 8px 16px;
    }
  </style>
</head>
<body>

<form>
  <!-- Basic Info -->
  <fieldset>
    <legend>Basic Info</legend>

    <label for="empid">Employee ID</label>
    <input type="text" id="empid" value="9"><br>

    <label for="lastname">Last Name</label>
    <input type="text" id="lastname" value="Dodsworth"><br>

    <label for="firstname">First Name</label>
    <input type="text" id="firstname" value="Anne"><br>

    <label>Gender</label>
    <div class="radio-group">
      <label><input type="radio" name="gender"> Male</label>
      <label><input type="radio" name="gender"> Female</label>
      <label><input type="radio" name="gender"> XXX</label>
      <label><input type="radio" name="gender" checked> ZZZ</label>
    </div>

    <label for="title">Title</label>
    <input type="text" id="title" value="Sales Representative"><br>

    <label for="suffix">Suffix</label>
    <input type="text" id="suffix" value="Ms."><br>

    <label for="birthdate">Birth Date</label>
    <input type="datetime-local" id="birthdate" value="1969-07-02T00:00"><br>

    <label for="hiredate">Hire Date</label>
    <input type="datetime-local" id="hiredate" value="1994-11-15T00:00"><br>

    <label for="ssn">SSN # (if applicable)</label>
    <input type="text" id="ssn"><br>

    <label for="reportsto">Reports To</label>
    <select id="reportsto">
      <option>Buchanan</option>
    </select><br>
  </fieldset>

  <!-- Contact Info -->
  <fieldset>
    <legend>Contact Info</legend>

    <label for="email">Email</label>
    <input type="email" id="email" placeholder="name@example.com"><br>

    <label for="address">Address</label>
    <input type="text" id="address" value="7 Houndstooth Rd."><br>

    <label for="city">City</label>
    <input type="text" id="city" value="London"><br>

    <label for="region">Region</label>
    <input type="text" id="region"><br>

    <label for="postal">Postal Code</label>
    <input type="text" id="postal" value="WG2 7LT"><br>

    <label for="country">Country</label>
    <select id="country">
      <option>Russian Federation</option>
      <option>Vietnam</option>
      <option>USA</option>
    </select><br>

    <label for="phone">US Home Phone</label>
    <input type="tel" id="phone" value="(234)234-2342"><br>

    <label for="photo">Photo</label>
    <input type="text" id="photo" value="EmpID9.bmp"><br>
  </fieldset>

  <!-- Optional Info -->
  <fieldset>
    <legend>Optional Info</legend>

    <label for="notes">Notes</label>
    <textarea id="notes" rows="5">
Anne has a BA degree in English from St. Lawrence College.
She is fluent in French and German.ZZZ
    </textarea><br>

    <label>Preferred Shift</label>
    <div class="checkbox-group">
      <label><input type="checkbox"> Regular</label>
      <label><input type="checkbox" checked> Gravy Yard</label>
    </div>

    <label>Active?</label>
    <input type="checkbox" checked><br>

    <label for="captcha">Are you human?</label>
    <div style="margin-bottom: 10px;">
      <strong>TIDAWO</strong> <a href="#">Click to change</a><br>
    </div>
    <input type="text" id="captcha"><br>
  </fieldset>

  <div class="actions">
    <input type="submit" value="Submit">
    <input type="reset" value="Cancel">
  </div>
</form>

</body>
</html>

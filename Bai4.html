<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Information</title>
    <style>
      
      * {
        font-family: Arial, serif;
      }
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .info-table {
            width: 100%;
            max-width: 600px;
            border-collapse: collapse;
        }
        .info-table td {
            padding: 8px;
        }
        .info-table td:first-child {
            font-weight: bold;
            width: 30%;
        }
        .radio-label {
            margin-right: 15px;
        }

        .text_input {
          width: 100%;
        }

        article {
          font-weight: bold;
          font-size: large;
          margin-top: 1cm;
        }
    </style>
</head>
<body>
<article>Basic Info</article>
<hr style="margin-top: 0%;">
<form action="">
<table class="info-table">
    <tr>
        <td>Employee ID</td>
        <td>9</td>
    </tr>
    <tr>
        <td>Last Name</td>
        <td>Dodsworth</td>
    </tr>
    <tr>
        <td><label for="first_name">First Name</label></td>
        <td><input type="text" id="first_name" name="firstname" class="text_input" autocomplete></td>
    </tr>
    <tr>
        <td>Gender</td>
        <td>
            <label class="radio-label"><input type="radio" name="gender"> Male</label><br>
            <label class="radio-label"><input type="radio" name="gender"> Female</label><br>
            <label class="radio-label"><input type="radio" name="gender"> XXX</label><br>
            <label class="radio-label"><input type="radio" name="gender" checked> ZZZ</label>
        </td>
    </tr>
    <tr>
      <td><label for="Title">Title</label></td>
      <td><input type="text" id="Title" name="Title" class="text_input"></td>
    </tr>
    <tr>
      <td><label for="Suffix">Suffix</label></td>
      <td><input type="text" id="Suffix" name="Suffix" class="text_input"></td>
    </tr>
    <tr>
      <td><label for="BirthDate">BirthDate</label></td>
      <td><input type="datetime-local" id="BirthDate" name="BirthDate" class="text_input"></td>
    </tr>
    <tr>
      <td><label for="HireDate">HireDate</label></td>
      <td><input type="datetime-local" id="HireDate" name="HireDate" class="text_input"></td>
    </tr>
    <tr>
      <td><label for="SSN">SSN # (if applicable)</label></td>
      <td><input type="email" id="SSN" name="SSN" class="text_input" novalidate></td>
    </tr>
    <tr>
      <td><label for="rp">Reports To</label></td>
      <td><select name="rp" id="rp">
        <option value="option1">Buchanan</option>
        <option value="option2">nguyendz</option>
        <option value="option3">nguyenxautrai</option>
        <option value="option4">nguyenxautrai</option>
        <option value="option5">nguyenxautrai</option>
        <option value="option6">nguyenxautrai</option>
        <option value="option7">nguyenxautrai</option>

      </select></td>
    </tr>
</table>
<article>Contact Info</article>
<hr style="margin-top: 0%;">
<table class="info-table">
  <tr>
    <td><label for="email">Email</label></td>
    <td><input type="email" id="email" class="text_input" placeholder="name@example.com"></td>
  </tr>
  <tr>
    <td><label for="Address">Address</label></td>
    <td><input type="text" id="Address" class="text_input"></td>
  </tr>
  <tr>
    <td><label for="City">City</label></td>
    <td><input type="text" id="City" class="text_input"></td>
  </tr>
  <tr>
    <td><label for="reg">Region</label></td>
    <td><input type="text" id="reg" class="text_input"></td>
  </tr>
  <tr>
    <td><label for="Postal Code">Postal Code</label></td>
    <td><input type="text" id="Postal Code" class="text_input"></td>
  </tr>
  <tr>
    <td><label for="Country">Country</label></td>
    <td><select id="Country" >
      <option value="option1">Vietnam</option>
      <option value="option2">Dong Lao</option>
      <option value="option3">Việt Nam</option>
    </select></td>
  </tr>
  <tr>
    <td><label for="phone">US Home Phone</label></td>
    <td><input type="text" class="text_input" id="phone"></td>
  </tr>
  <tr>
    <td><label for="image">Photo</label></td>
    <td><input type="image" class="text_input" id="image"></td>
  </tr>
</table>
<article>Optional Info</article>
<hr style="margin-top: 0%;">
<table class="info-table">
  <tr>
    <td><label for="notes">Notes</label></td>
    <td><textarea id="notes"></textarea></td>
  </tr>
  <tr>
    <td>Preffered Shift</td>
    <td>
      <input type="checkbox" id="regular" value="Regular">
      <label for="regular">Regular</label><br>
      <input type="checkbox" value="gravy yard" id="gravy">
      <label for="gravy">Gravy Yard</label>
    </td>
  </tr>
  <tr>
    <td><label for="active">Active?</label></td>
    <td><input type="checkbox" id="active"></td>
  </tr>
</table>
<footer>
  <hr>
  <div style="text-align: right;">
    <input type="submit" value="Submit"/>
  </div>
</footer>
</form>
</body>
</html>

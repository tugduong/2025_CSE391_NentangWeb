<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bai4</title>
    <style>
        /* CSS */
        body {
        font-family: Arial, sans-serif;
        margin: 20px;
        }
        .form-label {
            width: 200px;
            margin-right: 10px;
        }
        .form-group {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
        .form-group label {
            font-weight:bold;
            width: 200px;
            margin-right: 10px;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            flex: 1;
            padding: 5px;
            margin-top: 10px;
        }
        .checkbox-group,
        .radio-group {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
        }
    </style>
</head>
<body>
    <form>
        <section>
            <h2>Basic Info</h2>
            <hr>
            <div class="form-group">
                <label>Employee ID</label>
                <label class="form-label">9</label>
            </div>

            <div class="form-group">
                <label>Last Name</label>
                <label>Dodsworth</label>
            </div>

            <div class="form-group">
                <label>First Name</label>
                <input type="text" name="firstname"> </input>
            </div>

            <div class="form-group">
                <label>Gender</label>
                <div class="radio-group">
                    <label><input type="radio" name="gender" /> Male</label> 
                    <label><input type="radio" name="gender" checked /> Female</label> 
                    <label><input type="radio" name="gender" /> XXX</label> 
                    <label><input type="radio" name="gender" /> ZZZ</label> 
                </div>
            </div>

            <div class="form-group">
                <label>Title</label>
                <input type="text" name="titile"> </input>
            </div>

            <div class="form-group">
                <label>Suffix</label>
                <input type="text" name="suffix"> </input>
            </div>

            <div class="form-group">
                <label>BirthDate</label>
                <input type="datetime-local" value="1969-07-02 00:00:00" />
            </div>

            <div class="form-group">
                <label>HireDate</label>
                <input type="datetime-local" value="1994-11-15 00:00:00" />
            </div>

            <div class="form-group">
                <label>SSN # (if applicable)</label>
                <input type="text" />
            </div>

            <div class="form-group">
                <label>Reports To</label>
                <select>
                  <option>Buchanan</option>
                  <option>Fuller</option>
                  <option>Leverling</option>
                </select>
            </div>
        </section>
        
      <section>
        <h2>Contact Info</h2>
        <hr />
        <div class="form-group">
          <label>Email</label>
          <input type="email" value="name@example.com" />
        </div>

        <div class="form-group">
          <label>Address</label>
          <input type="text" value="7 Houndstooth Rd." />
        </div>

        <div class="form-group">
          <label>City</label>
          <input type="text" value="London" />
        </div>

        <div class="form-group">
          <label>Region</label>
          <input type="text" />
        </div>

        <div class="form-group">
          <label>Postal Code</label>
          <input type="text" value="WG2 7LT" />
        </div>

        <div class="form-group">
          <label>Country</label>
          <select>
            <option>Russian Federation</option>
          </select>
        </div>

        <div class="form-group">
          <label>US Home Phone</label>
          <input type="tel" value="(234)234-2342" />
        </div>

        <div class="form-group">
          <label>Photo</label>
          <input type="text" value="EmpID9.bmp" />
        </div>
      </section>

        <section>
            <h2>Optional Info</h2>
            <hr>
            
        <div class="form-group">
            <label>Notes</label>
            <textarea rows="4">
  Anne has a BA degree in English from St. Lawrence College. She is fluent in French and German.ZZZ</textarea
            >
          </div>
  
          <div class="form-group">
            <label>Preferred Shift</label>
            <div class="checkbox-group">
              <label><input type="checkbox" name="shift" checked /> Regular</label>
              <label><input type="checkbox" name="shift" /> Gravy Yard</label>
            </div>
          </div>
  
          <div class="form-group">
            <label>Active?</label>
            <input type="checkbox" checked />
          </div>
  
          <div class="form-group">
            <label>Are you human?</label>

            <div style="display: flex; align-items: center; gap: 10px">
              <strong>TIDAWO</strong>
              <button type="button">Click to change</button>
            </div>

            <input type="text" />
          </div>
        </section>
        
    </form>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng điểm sinh viên</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: #f2f2f2;
            font-weight: bold;
        }
        .sub-header {
            font-weight: normal;
            background-color: #f8f8f8;
        }
        .main-header {
            background-color: #e6e6e6;
        }
    </style>
</head>
<body>
    <h1>Bảng điểm sinh viên</h1>
    
    <table>
        <!-- Header chính -->
        <tr class="main-header">
            <th rowspan="3">Student</th>
            <th colspan="4">Exam</th>
            <th colspan="4">2nd Exam</th>
            <th colspan="2">Final Grade</th>
        </tr>
        
        <!-- Header phụ -->
        <tr class="main-header">
            <th colspan="3">Questions</th>
            <th rowspan="2">Grade</th>
            <th colspan="3">Questions</th>
            <th rowspan="2">Grade</th>
            <th rowspan="2">NR</th>
            <th rowspan="2">R</th>
        </tr>
        <tr class="main-header">
            <th>Q1</th>
            <th>Q2</th>
            <th>Q3</th>
            <th>Q1</th>
            <th>Q2</th>
            <th>Q3</th>
        </tr>
        
        <!-- Hàng điểm số -->
        <tr class="sub-header">
            <th>Code</th>
            <th>8</th>
            <th>7</th>
            <th>5</th>
            <th>6</th>
            <th>7</th>
            <th>8</th>
            <th></th>
            <th></th>
            <th></th>
        </tr>
        
        <!-- Dữ liệu sinh viên -->
        <tr>
            <td>80549051</td>
            <td>70%</td>
            <td>100%</td>
            <td>100%</td>
            <td>17.6</td>
            <td></td>
            <td></td>
            <td></td>
            <td>17.6</td>
            <td>18</td>
        </tr>
        <tr>
            <td>80549052</td>
            <td>10%</td>
            <td>50%</td>
            <td>50%</td>
            <td>6.8</td>
            <td>100%</td>
            <td>100%</td>
            <td>50%</td>
            <td>16.5</td>
            <td>17</td>
        </tr>
        <tr>
            <td>80549053</td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td>50%</td>
            <td>50%</td>
            <td>50%</td>
            <td>10.0</td>
            <td>10</td>
        </tr>
    </table>
</body>
</html>
